:root{color-scheme:dark;--gold:#dfc080;--cream:#fff5df;--muted:#b9cec4}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;background:radial-gradient(ellipse at 50% 0%,#11604d 0%,#073f34 43%,#032a25 100%);color:var(--cream);font-family:Tahoma,Arial,sans-serif;line-height:1.7}body:before{content:"";position:fixed;inset:12px;border:1px solid #d9b87522;border-radius:25px;pointer-events:none}main{width:min(100% - 40px,740px);margin:auto;padding:36px 0 28px}header{text-align:center;margin-bottom:25px}.teacher{display:inline-block;margin:0 0 14px;padding:5px 20px;border:1px solid #d9b87550;border-radius:100px;color:var(--gold);font-size:15px}.brand{width:51px;height:51px;margin:0 auto 9px;color:var(--gold)}svg{display:block;width:100%;height:100%}h1{font-size:clamp(32px,6vw,47px);line-height:1.45;margin:0;font-weight:700;letter-spacing:-1px}.tagline{margin:7px 0 0;color:var(--muted);font-size:clamp(15px,2.8vw,19px)}.divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:19px auto 0;color:var(--gold)}.divider:before,.divider:after{content:"";width:57px;height:1px;background:linear-gradient(90deg,transparent,#dfc08080)}.divider:after{transform:rotate(180deg)}.divider span{width:5px;height:5px;background:var(--gold);transform:rotate(45deg)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{min-width:0;min-height:164px;padding:21px 12px 15px;text-decoration:none;color:var(--cream);border:1px solid #d9b87585;border-radius:20px;background:linear-gradient(145deg,#ffffff08,#ffffff02);box-shadow:0 8px 22px #001e181c;display:flex;align-items:center;flex-direction:column;justify-content:center;text-align:center;transition:transform .18s,background .18s,border-color .18s}.icon{width:42px;height:42px;color:var(--gold);margin-bottom:12px}.card h2{font-size:clamp(15px,2.8vw,21px);line-height:1.7;margin:0;font-weight:700;overflow-wrap:anywhere}.open{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);margin-top:8px}.open span{color:var(--gold);font-size:17px;line-height:1}.join{display:flex;justify-content:center;align-items:center;gap:12px;width:100%;margin-top:22px;padding:15px 12px;border-radius:15px;background:linear-gradient(110deg,#cfa75c,#f1d99d,#d8b56f);border:1px solid #f2db9d;color:#153d30;font-weight:700;font-size:clamp(17px,3vw,21px);text-decoration:none;text-align:center;box-shadow:0 7px 25px #0002}.join svg{width:23px;height:23px;flex:none}a:focus-visible{outline:3px solid #fff0c6;outline-offset:5px}footer{text-align:center;color:#a7bfb2;font-size:12px;margin-top:19px}@media(hover:hover){.card:hover{transform:translateY(-3px);background:#ffffff0c;border-color:var(--gold)}.join:hover{filter:brightness(1.06)}}@media(min-width:700px){main{padding-top:42px}.grid{gap:20px}.card{min-height:187px;padding:25px 15px}.icon{width:47px;height:47px}header{margin-bottom:30px}}@media(max-width:360px){main{width:calc(100% - 32px);padding-top:26px}.grid{gap:10px}.card{padding:17px 8px;min-height:158px;border-radius:16px}.card h2{font-size:14px}.teacher{font-size:14px}.join{font-size:16px}}@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
